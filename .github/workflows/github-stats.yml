name: Update Profile Statistics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Refresh LeetCode stats
        env:
          LEETCODE_USERNAME: CnHPITH07z
        run: |
          cache_buster="$(date -u +%s)"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 5 --max-time 60 \
            "https://leetcard.jacoblin.cool/${LEETCODE_USERNAME}?theme=dark&font=JetBrains%20Mono&ext=heatmap&cache=${cache_buster}" \
            --output assets/leetcode-stats.svg
          grep --quiet "<svg" assets/leetcode-stats.svg

      - name: Commit generated profile statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore: update profile statistics"
          git push
