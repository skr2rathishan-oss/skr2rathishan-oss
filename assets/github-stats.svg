no">3</text><text x="839" y="316" fill="#334155" font-size="30" font-weight="700" text-anchor="end" class="mono">03</text></g><g class="fade" style="animation-delay:480ms"><text x="34" y="375" fill="#cbd5e1" font-size="12" font-weight="700" letter-spacing="1.2">ACTIVITY MIX</text><text x="866" y="375" fill="#64748b" font-size="11" text-anchor="end">380 recorded actions</text><rect x="34" y="391" width="832" height="12" rx="6" fill="#1e293b"/><rect x="34" y="391" width="705.0" height="12" rx="6" fill="#22d3ee"/><rect x="739.0" y="391" width="124.8" height="12" fill="#8b5cf6"/><rect x="863.8" y="391" width="2.2" height="12" rx="6" fill="#34d399"/><circle cx="39" cy="438" r="4" fill="#22d3ee"/><text x="51" y="442" fill="#94a3b8" font-size="12">COMMITS</text><text x="132" y="442" fill="#e2e8f0" font-size="12" font-weight="700" class="mono">322</text><circle cx="218" cy="438" r="4" fill="#8b5cf6"/><text x="230" y="442" fill="#94a3b8" font-size="12">PULL REQUESTS</text><text x="344" y="442" fill="#e2e8f0" font-size="12" font-weight="700" class="mono">57</text><circle cx="430" cy="438" r="4" fill="#34d399"/><text x="442" y="442" fill="#94a3b8" font-size="12">ISSUES</text><text x="495" y="442" fill="#e2e8f0" font-size="12" font-weight="700" class="mono">1</text><text x="866" y="442" fill="#475569" font-size="10" text-anchor="end" class="mono">AUTOMATICALLY REFRESHED DAILY</text></g></svg>