<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc"><title id="title">GitHub streak analytics</title><desc id="desc">A neon three-column GitHub dashboard showing total contributions, current streak, longest streak, and supporting profile metrics.</desc>
    <defs>
      <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b1220"/>
        <stop offset="0.52" stop-color="#0d1424"/>
        <stop offset="1" stop-color="#090f1b"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8b5cf6"/>
        <stop offset="0.5" stop-color="#22d3ee"/>
        <stop offset="1" stop-color="#34d399"/>
      </linearGradient>
      <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#172033" stop-opacity="0.92"/>
        <stop offset="1" stop-color="#111827" stop-opacity="0.78"/>
      </linearGradient>
      <radialGradient id="glow">
        <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
        <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
      </radialGradient>
      <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
        <path d="M28 0H0V28" fill="none" stroke="#64748b" stroke-opacity="0.045"/>
      </pattern>
      <style>
        text { font-family: "Segoe UI", Arial, sans-serif; }
        .mono { font-family: "JetBrains Mono", Consolas, monospace; }
        .fade { animation: rise .7s ease-out both; }
        .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
        .flow { animation: flow 5s linear infinite; }
        .ring { animation: drawRing 1.4s cubic-bezier(.22,.9,.32,1) both, ringGlow 2.8s ease-in-out 1.4s infinite; }
        .stat-zone { transition: opacity .2s ease; }
        .stat-zone:hover { opacity: .82; }
        @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
        @keyframes flow { to { stroke-dashoffset: -80; } }
        @keyframes drawRing { from { stroke-dashoffset: 402; } to { stroke-dashoffset: 0; } }
        @keyframes ringGlow { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      </style>
    </defs>
    <rect x="1" y="1" width="898" height="408" rx="22" fill="url(#panel)" stroke="#334155"/><rect x="1" y="1" width="898" height="408" rx="22" fill="url(#grid)"/><ellipse cx="830" cy="20" rx="210" ry="170" fill="url(#glow)"/><path d="M22 1H878" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/><g class="fade"><circle cx="40" cy="37" r="5" fill="#76ff03" filter="url(#softGlow)" class="pulse"/><text x="55" y="42" fill="#f8fafc" font-size="19" font-weight="700" letter-spacing="1.6">GITHUB ANALYTICS</text><text x="858" y="40" fill="#64748b" font-size="10" text-anchor="end" class="mono">UPDATED 12 AUG 2026 · 13:49 UTC</text></g><rect x="34" y="67" width="832" height="274" rx="17" fill="#030507" stroke="#1f2937"/><rect x="35" y="68" width="830" height="272" rx="16" fill="none" stroke="url(#accent)" stroke-opacity="0.22"/><path d="M311 99V309M589 99V309" stroke="#64748b" stroke-opacity="0.75"/><g class="stat-zone fade" style="animation-delay:100ms"><text x="172" y="158" fill="#76ff03" font-size="42" font-weight="800" text-anchor="middle" class="mono">453</text><text x="172" y="201" fill="#76ff03" font-size="16" font-weight="600" text-anchor="middle">Total Contributions</text><text x="172" y="238" fill="#f1f5f9" font-size="12" text-anchor="middle" class="mono">Aug 10, 2025 — PRESENT</text><text x="172" y="285" fill="#64748b" font-size="10" text-anchor="middle" class="mono">338 COMMITS · 57 PRS · 1 ISSUES</text></g><g class="stat-zone fade" style="animation-delay:220ms"><circle cx="450" cy="164" r="65" fill="#061006" stroke="#172033" stroke-width="8"/><circle cx="450" cy="164" r="65" fill="none" stroke="#76ff03" stroke-width="7" stroke-linecap="round" stroke-dasharray="402" class="ring" filter="url(#softGlow)" transform="rotate(-90 450 164)"/><circle cx="450" cy="164" r="54" fill="url(#glow)" opacity="0.55"/><path d="M450 76c8 9 8 18 1 24 11-2 17-11 13-22 11 7 16 18 12 28-4 12-14 18-26 18s-22-6-26-18c-4-11 2-23 14-30-2 10 1 17 7 20-2-8-1-14 5-20Z" fill="#76ff03" filter="url(#softGlow)" class="pulse"/><text x="450" y="179" fill="#00c8ff" font-size="38" font-weight="800" text-anchor="middle" class="mono">0</text><text x="450" y="262" fill="#00c8ff" font-size="17" font-weight="700" text-anchor="middle">Current Streak</text><text x="450" y="294" fill="#f1f5f9" font-size="11" text-anchor="middle" class="mono">Last active Aug 8, 2026</text></g><g class="stat-zone fade" style="animation-delay:340ms"><text x="728" y="158" fill="#76ff03" font-size="42" font-weight="800" text-anchor="middle" class="mono">7</text><text x="728" y="201" fill="#76ff03" font-size="16" font-weight="600" text-anchor="middle">Longest Streak</text><text x="728" y="238" fill="#f1f5f9" font-size="12" text-anchor="middle" class="mono">Jun 25 — Jul 1, 2026</text><text x="728" y="285" fill="#64748b" font-size="10" text-anchor="middle" class="mono">PERSONAL CONSISTENCY RECORD</text></g><g class="fade" style="animation-delay:500ms"><text x="40" y="379" fill="#64748b" font-size="10" letter-spacing="1">PROFILE SIGNAL</text><text x="155" y="379" fill="#cbd5e1" font-size="11" class="mono">10 REPOSITORIES</text><circle cx="278" cy="375" r="2" fill="#334155"/><text x="299" y="379" fill="#cbd5e1" font-size="11" class="mono">1 STARS</text><circle cx="375" cy="375" r="2" fill="#334155"/><text x="396" y="379" fill="#cbd5e1" font-size="11" class="mono">3 FOLLOWERS</text><circle cx="511" cy="375" r="2" fill="#334155"/><text x="532" y="379" fill="#22d3ee" font-size="10" class="mono">LIVE GITHUB GRAPHQL</text><text x="858" y="379" fill="#475569" font-size="9" text-anchor="end" class="mono">REFRESHED DAILY</text></g></svg>